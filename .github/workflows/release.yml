name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest version, and betas are pre-releases
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/family_tasks/manifest.json'))['version'])")
          echo "tag=$tag manifest=$version prerelease=$PRERELEASE"
          test "$tag" = "$version" || { echo "::error::tag v$tag does not match manifest version $version"; exit 1; }
          if [[ "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            test "$PRERELEASE" = "true" || { echo "::error::$version is a beta; publish it as a pre-release"; exit 1; }
          else
            test "$PRERELEASE" = "false" || { echo "::error::$version is a final version; don't mark it pre-release"; exit 1; }
          fi
